name: Trading agent race

on:
  schedule:
    - cron: "5,35 13-20 * * 1-5"
    - cron: "30 21 * * 5"
    # Overnight game-plan sessions (plan.py picks the right one by US/Eastern time and skips repeats):
    - cron: "40 20,21 * * 1-5"   # after the close
    - cron: "10 0 * * 1-5"       # evening check-in (Sun-Thu evenings ET)
    - cron: "40 11,12 * * 1-5"   # pre-market call
  workflow_dispatch:
    inputs:
      task:
        description: "run (one cycle), review (weekly self-review), plan (game-plan session), universe (rebuild stock list) or alert (send a test phone alert)"
        default: "run"
      force:
        description: "Run even if the market is closed (true/false)"
        default: "false"
      agent:
        description: "Plan only: limit to one agent (trend, meanrev, volsell)"
        default: ""

permissions:
  contents: write

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCREENER_URL: ${{ vars.SCREENER_URL }}
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL || 'claude-haiku-5-5' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
          PLAN_MODEL: ${{ vars.PLAN_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DASHBOARD_URL: https://teamcomeback.github.io/Curiosity/
        run: |
          SCHED="${{ github.event.schedule }}"
          if [ "$SCHED" = "30 21 * * 5" ] || [ "${{ inputs.task }}" = "review" ]; then
            python review.py
          elif [ "$SCHED" = "40 20,21 * * 1-5" ] || [ "$SCHED" = "10 0 * * 1-5" ] || [ "$SCHED" = "40 11,12 * * 1-5" ]; then
            python plan.py
          elif [ "${{ inputs.task }}" = "alert" ]; then
            python admin.py alert
          elif [ "${{ inputs.task }}" = "universe" ]; then
            python admin.py universe
          elif [ "${{ inputs.task }}" = "plan" ]; then
            AG="${{ inputs.agent }}"
            if [ "${{ inputs.force }}" = "true" ]; then python plan.py --force ${AG:+--agent $AG}; else python plan.py ${AG:+--agent $AG}; fi
          elif [ "${{ inputs.force }}" = "true" ]; then
            python run.py --force
          else
            python run.py
          fi

      - name: Save results to repo
        if: always()
        run: |
          [ -d data ] || { echo "No data yet"; exit 0; }
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "agent: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
