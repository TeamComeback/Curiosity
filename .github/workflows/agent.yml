name: Trading agent race

on:
  schedule:
    # Every job runs the firms' whole day as a self-continuing chain (see daylong.py). GitHub often
    # starts scheduled jobs late or skips them, so there are many start times: whichever fires first
    # starts the chain, and any that fire while it's running wait their turn and exit if there's
    # nothing to do. Times are UTC: 11:20 = 7:20 AM EDT; the 23:20 and 00:20 starts cover the
    # evening check-in, including Sunday's.
    - cron: "20 11-23 * * 1-5"
    - cron: "20 0 * * 1-5"
    - cron: "20 23 * * 0"
  workflow_dispatch:
    inputs:
      task:
        description: "day (trade all day), run (one cycle), review (weekly self-review), plan (game-plan session), universe (rebuild stock list), radar (Crash Radar reading) or alert (send a test phone alert)"
        default: "run"
      force:
        description: "Run even if the market is closed (true/false)"
        default: "false"
      agent:
        description: "Plan only: limit to one agent (trend, meanrev, volsell, blackswan, scalper)"
        default: ""

permissions:
  contents: write
  actions: write          # lets a job start its successor before GitHub's 6-hour limit

concurrency:
  group: trading-agent
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCREENER_URL: ${{ vars.SCREENER_URL }}
          BRAIN_MODEL: ${{ vars.BRAIN_MODEL || 'claude-haiku-5-5' }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'claude-sonnet-5-5' }}
          PLAN_MODEL: ${{ vars.PLAN_MODEL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DASHBOARD_URL: https://teamcomeback.github.io/Curiosity/
        run: |
          SCHED="${{ github.event.schedule }}"
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          if [ -n "$SCHED" ] || [ "${{ inputs.task }}" = "day" ]; then
            python daylong.py 330
          elif [ "${{ inputs.task }}" = "review" ]; then
            python review.py
          elif [ "${{ inputs.task }}" = "recap" ]; then
            python recap.py
          elif [ "${{ inputs.task }}" = "radar" ]; then
            python admin.py radar
          elif [ "${{ inputs.task }}" = "alert" ]; then
            python admin.py alert
          elif [ "${{ inputs.task }}" = "universe" ]; then
            python admin.py universe
          elif [ "${{ inputs.task }}" = "plan" ]; then
            AG="${{ inputs.agent }}"
            if [ "${{ inputs.force }}" = "true" ]; then python plan.py --force ${AG:+--agent $AG}; else python plan.py ${AG:+--agent $AG}; fi
          elif [ "${{ inputs.force }}" = "true" ]; then
            python run.py --force
          else
            python run.py
          fi

      - name: Save results to repo
        if: always()
        run: |
          [ -d data ] || { echo "No data yet"; exit 0; }
          git config user.name "trading-agent"
          git config user.email "trading-agent@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "agent: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
