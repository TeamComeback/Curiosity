<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Portfolio Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ground:#e9ece8;--paper:#f6f7f4;--ink:#1f2a2e;--ink2:#56636a;--rule:#a9b3b4;--faint:#d5dad7;
  --trend:#2f6fb5;--meanrev:#d9822b;--volsell:#1f9e73;--blackswan:#6a4fc0;--scalper:#0a8fb0;--baseline:#7e8a8c;--monkey:#c0507d;--gold:#b98a1f;--good:#2c8a3e;--bad:#c4423b;
}
@media (prefers-color-scheme:dark){:root{
  color-scheme:dark;
  --ground:#11171a;--paper:#182024;--ink:#dce3e2;--ink2:#9aa7a9;--rule:#4a575c;--faint:#26312f;
  --trend:#5b93d6;--meanrev:#e59a4c;--volsell:#3cbb8f;--blackswan:#9b84e8;--scalper:#2fb6d6;--baseline:#8d999b;--monkey:#e07ba4;--gold:#d8ab3e;--good:#5cc06c;--bad:#e06a62;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 "IBM Plex Sans Condensed",-apple-system,BlinkMacSystemFont,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 28px)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:8px 0 4px;gap:8px}
.bar h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
.bar nav{display:flex;gap:8px}
.bar a{color:var(--ink2);font-size:14px;text-decoration:none;border:1px solid var(--rule);border-radius:6px;padding:4px 10px}
a:focus-visible,button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.lede{color:var(--ink2);margin:2px 0 14px;font-size:14px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.chip{flex:none;font:inherit;font-size:14px;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);font-weight:600}
.chip i{display:inline-block;width:9px;height:9px;margin-right:6px;vertical-align:0}
.sheet{background:var(--paper);border:1.5px solid var(--ink);margin-bottom:14px}
.sheet header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 12px;border-bottom:1px solid var(--rule)}
.sheet header h2{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:8px}
.sheet header h2 i{width:7px;height:20px;display:inline-block}
.sheet header .val{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.sheet header .val small{display:block;font-size:13px;font-weight:500}
.sec{padding:10px 12px;border-bottom:1px solid var(--faint)}
.sec:last-child{border-bottom:0}
.sec h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--ink2)}
.sec p{margin:3px 0;font-size:14px}
.muted{color:var(--ink2)}
.up{color:var(--good)}.down{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--ink2);font-size:12px;padding:3px 4px;border-bottom:1px solid var(--rule)}
td{padding:5px 4px;border-bottom:1px solid var(--faint);vertical-align:top}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
.tag{display:inline-block;font-size:12px;border:1px solid var(--rule);padding:0 6px;margin:2px 4px 2px 0}
.tag.lean{border-color:var(--good);color:var(--good)}
.tag.avoid{border-color:var(--bad);color:var(--bad)}
.log{list-style:none;margin:0;padding:0}
.trades{list-style:none;margin:0;padding:0}
.trades li{padding:8px 0;border-top:1px solid var(--faint)}
.trades li:first-child{border-top:0}
.trades .t1{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.trades .t1 b{font-weight:600}
.trades .t2,.trades .t3{font-size:13px;color:var(--ink2);margin-top:2px}
.trades details summary{font-size:13px;color:var(--ink2);cursor:pointer;margin-top:2px}
.trades details p{font-size:13px;margin:4px 0 0}
.when{font-size:12px;color:var(--ink2)}
.log li{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:9px 12px;border-bottom:1px solid var(--faint)}
.log li:last-child{border-bottom:0}
.log time{font-size:12px;color:var(--ink2);line-height:1.3}
.log .what{font-weight:600;font-size:14px}
.log .what i{width:8px;height:8px;display:inline-block;margin-right:6px;vertical-align:1px}
.log .why{font-size:14px;margin-top:2px}
.log .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.more{font:inherit;width:100%;padding:10px;background:none;border:0;border-top:1px solid var(--rule);color:var(--ink2);cursor:pointer}
.empty{padding:12px;color:var(--ink2)}
</style>
</head>
<body>
<div class="wrap">
  <div class="bar"><h1>Portfolio book</h1><nav><a href="arena.html">The Street</a><a href="index.html">Dashboard</a></nav></div>
  <p class="lede" id="lede">Every holding, every trade and every decision each firm made, with the reason it gave at the time.</p>
  <div class="chips" id="chips" role="group" aria-label="Show firm"></div>
  <div id="sheets"></div>
  <section class="sheet" aria-labelledby="logh">
    <header><h2 id="logh">Decision log</h2><span class="muted" id="logcount"></span></header>
    <ul class="log" id="log"></ul>
    <button class="more" id="more" hidden>Show older decisions</button>
  </section>
</div>
<script>
const NAMES = {trend:"Trend Co.", meanrev:"Snapback Partners", volsell:"Premium House", blackswan:"Black Swan & Co.", scalper:"Rapid Fire Trading", baseline:"Index Booth (SPY)", monkey:"Monkey Business"};
const ORDER = ["trend", "meanrev", "volsell", "blackswan", "scalper", "monkey", "baseline"];
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money = n => n == null ? "–" : (n < 0 ? "-" : "") + "$" + Math.abs(Number(n)).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const signed = n => (n >= 0 ? "+" : "-") + "$" + Math.abs(Number(n)).toFixed(2);
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const nice = sym => { const m = /^([A-Z]+)(\d{2})(\d{2})(\d{2})([CP])(\d{8})$/.exec(sym || ""); return m ? `${m[1]} $${+m[6] / 1000} ${m[5] === "C" ? "call" : "put"} ${MON[+m[3] - 1]} ${+m[4]}` : (sym || ""); };
const stamp = t => { if (!t) return "–"; const d = new Date(t); return `${MON[d.getMonth()]} ${d.getDate()}, ${d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})}`; };
const held = (a, b) => { const m = Math.max(0, (new Date(b || Date.now()) - new Date(a)) / 60000);
  return m < 60 ? `${Math.round(m)} min` : m < 1440 ? `${Math.floor(m / 60)}h ${Math.round(m % 60)}m` : `${Math.floor(m / 1440)}d ${Math.round((m % 1440) / 60)}h`; };
const KIND = {stock: "shares", option: "option", spread: "credit spread", debit_spread: "put spread"};
const when = t => { const d = new Date(t); return `${MON[d.getMonth()]} ${d.getDate()}<br>${d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"})}`; };
let D = null, L = [], pick = "all", shown = 40;

Promise.all([fetch("data/dashboard.json?ts=" + Date.now()).then(r => r.json()), fetch("data/ledger.json?ts=" + Date.now()).then(r => r.ok ? r.json() : []).catch(() => [])])
  .then(([d, l]) => { D = d; L = l.slice().reverse(); draw(); })
  .catch(() => { $("sheets").innerHTML = '<div class="sheet"><div class="empty">No data yet. The book fills in after the agents\' first run.</div></div>'; });

setInterval(() => {                       // keep the book current without a manual reload
  if (document.hidden || !D) return;
  Promise.all([fetch("data/dashboard.json?ts=" + Date.now()).then(r => r.json()), fetch("data/ledger.json?ts=" + Date.now()).then(r => r.ok ? r.json() : [])])
    .then(([d, l]) => { if (d.updated !== D.updated || d.plans_updated !== D.plans_updated || l.length !== L.length){ D = d; L = l.slice().reverse(); draw(); } }).catch(() => {});
}, 60000);

function pnl(p){
  if (p.kind === "stock" && p.last != null) return (p.last - p.entry) * p.qty;
  if (p.kind === "option" && p.mark != null) return (p.mark - p.entry) * 100 * p.qty;
  if (p.kind === "spread" && p.mark != null) return (p.entry - p.mark) * 100 * p.qty;
  if (p.kind === "debit_spread" && p.mark != null) return (p.mark - p.entry) * 100 * p.qty;
  return null;
}

function draw(){
  const ids = ORDER.filter(id => D.agents.some(a => a.id === id));
  $("chips").innerHTML = [["all", "All firms"], ...ids.map(id => [id, NAMES[id]])].map(([id, label]) =>
    `<button class="chip" aria-pressed="${pick === id}" data-id="${id}">${id === "all" ? "" : `<i style="background:var(--${id})"></i>`}${esc(label)}</button>`).join("");
  $("chips").querySelectorAll("button").forEach(b => b.onclick = () => { pick = b.dataset.id; shown = 40; draw(); });
  const start = D.start_balance || 100;
  $("sheets").innerHTML = ids.filter(id => pick === "all" || pick === id).map(id => sheet(id, start)).join("");
  log();
}

function sheet(id, start){
  const a = D.agents.find(x => x.id === id), ret = (a.equity / start - 1) * 100;
  const pos = (D.positions || []).filter(p => p.agent === id);
  const opened = Object.fromEntries(L.filter(e => e.type === "trade_opened" && e.agent === id).map(e => [e.position_id || e.symbol, e]));
  const f = (D.focus || {})[id], stats = (D.sector_stats || {})[id] || {};
  const closed = L.filter(e => e.type === "trade_closed" && e.agent === id && !e.partial);
  const realized = closed.reduce((s, e) => s + (e.pnl || 0), 0) + pos.reduce((s, p) => s + (p.realized || 0), 0);
  const rd = (D.radar || {}).now;
  const pbk = (D.playbooks || {})[id];
  const role = id === "scalper" ? `Racing to $${(D.race.goal || 10000).toLocaleString()} with quick intraday trades${pbk ? ` · playbook: ${pbk.aggression}, watching ${(pbk.watch || []).slice(0, 5).join(", ")}` : ""}` : id === "blackswan" ? `Racing to $${(D.race.goal || 10000).toLocaleString()} by betting on falling prices${rd && rd.score != null ? ` · Crash Radar ${rd.score}/100 (${rd.tier})` : ""}` : id === "monkey" ? "Control group: random picks, same rules" : id === "baseline" ? "Benchmark: SPY bought and held" : `Racing to $${(D.race.goal || 10000).toLocaleString()}`;
  return `<section class="sheet" aria-label="${esc(NAMES[id])}">
    <header><div><h2><i style="background:var(--${id})"></i>${esc(NAMES[id])}</h2><div class="muted" style="font-size:13px">${esc(role)} · ${esc(a.status)}</div></div>
      <div class="val">${money(a.equity)}<small class="${ret >= 0 ? "up" : "down"}">${ret >= 0 ? "+" : ""}${ret.toFixed(1)}% since start</small></div></header>
    <div class="sec"><h3>Books</h3>
      <p>Cash ${money(a.available)}${a.settling ? ` (+${money(a.settling)} settling)` : ""} · ${pos.length} open · ${a.closed} closed${a.win_rate != null ? ` · ${a.win_rate}% winners` : ""} · realized ${closed.length ? signed(realized) : "$0.00"}</p></div>
    ${["trend", "meanrev", "volsell", "blackswan", "scalper"].includes(id) ? `<div class="sec"><h3>Sector focus</h3>${f && (f.lean_in.length || f.avoid.length) ?
      `<p>${f.lean_in.map(s => `<span class="tag lean">${id === "blackswan" ? "Betting against" : "Leaning into"} ${esc(s)}</span>`).join("")}${f.avoid.map(s => `<span class="tag avoid">Avoiding ${esc(s)}</span>`).join("")}</p>
       <p class="muted">${esc(f.why)}${/[.!?]$/.test(f.why || "") ? "" : "."} Expires ${esc(f.expires)} unless renewed.</p>` : `<p class="muted">No sector focus yet. The planners set one once they see a sector working.</p>`}</div>` : ""}
    <div class="sec"><h3>Holdings</h3>${pos.length ? `<table><thead><tr><th>Position</th><th>Sector</th><th class="n">Cost</th><th class="n">P&amp;L</th></tr></thead><tbody>${
      pos.map(p => { const v = pnl(p), o = opened[p.position_id] || opened[p.symbol] || {};
        return `<tr><td><b>${esc(nice(p.symbol))}</b>${p.kind === "stock" ? ` · ${Number(p.qty).toFixed(4)} sh` : p.structure ? ` · ${esc(p.structure)}` : ""}
          <div class="when">Opened ${esc(stamp(p.opened))} · held ${esc(held(p.opened))}${p.expiry ? ` · expires ${esc(p.expiry)}` : ""}</div>
          <div class="muted" style="font-size:13px">${esc(p.thesis || o.why || "")}</div></td><td>${esc(o.sector || "–")}</td>
          <td class="n">${money(Math.abs(p.cost || 0))}</td><td class="n ${v == null ? "" : v >= 0 ? "up" : "down"}">${v == null ? "–" : signed(v)}</td></tr>`; }).join("")
      }</tbody></table>` : `<p class="muted">Nothing held right now.</p>`}</div>
    <div class="sec"><h3>Trade history${closed.length ? ` (${closed.length} closed)` : ""}</h3>${history(id)}</div>
    ${Object.keys(stats).length ? `<div class="sec"><h3>Results by sector</h3><table><thead><tr><th>Sector</th><th class="n">Trades</th><th class="n">Winners</th><th class="n">P&amp;L</th></tr></thead><tbody>${
      Object.entries(stats).map(([s, v]) => `<tr><td>${esc(s)}</td><td class="n">${v.trades}</td><td class="n">${v.win_rate_pct ?? "–"}%</td><td class="n ${v.pnl >= 0 ? "up" : "down"}">${signed(v.pnl)}</td></tr>`).join("")
    }</tbody></table></div>` : ""}
  </section>`;
}

function history(id){
  const rows = L.filter(e => e.type === "trade_closed" && e.agent === id);      // newest first
  if (!rows.length) return `<p class="muted">No closed trades yet.</p>`;
  const opens = Object.fromEntries(L.filter(e => e.type === "trade_opened" && e.agent === id).map(e => [e.position_id, e]));
  return `<ul class="trades">${rows.slice(0, 50).map(e => {
    const o = opens[e.position_id] || {}, v = e.pnl || 0;
    const ret = e.return_pct != null ? ` (${e.return_pct >= 0 ? "+" : ""}${e.return_pct}%)` : "";
    return `<li><div class="t1"><span><b>${esc(nice(e.symbol))}</b> · ${esc(KIND[e.instrument] || e.instrument || "")}${e.partial ? " · partial" : ""}</span>
        <span class="${v >= 0 ? "up" : "down"}">${signed(v)}${ret}</span></div>
      <div class="t2">Bought ${esc(stamp(e.opened))}${e.entry != null ? ` at ${money(e.entry)}` : ""} → sold ${esc(stamp(e.time))}${e.exit != null ? ` at ${money(e.exit)}` : ""} · held ${esc(held(e.opened, e.time))}</div>
      <div class="t3">Exit: ${esc(e.why_exited || "–")}${e.sector ? ` · ${esc(e.sector)}` : ""}</div>
      ${e.why_entered ? `<details><summary>Why it bought${o.confidence ? ` (confidence ${o.confidence}/5)` : ""}</summary><p>${esc(e.why_entered)}</p></details>` : ""}</li>`;
  }).join("")}</ul>`;
}

function entry(e){
  const c = `<i style="background:var(--${e.agent || "rule"})"></i>`, who = NAMES[e.agent] || "All firms";
  switch (e.type){
    case "trade_opened": return {what: `${c}${esc(who)} bought ${esc(nice(e.symbol))}${({stock: " shares", debit_spread: " put spread", spread: " credit spread"})[e.instrument] || ""} for ${money(Math.abs(e.cost || 0))}${e.cost < 0 ? " credit" : ""}`,
      why: e.why, sub: [e.sector, e.from_plan ? "from the overnight plan" : "", e.confidence ? `confidence ${e.confidence}/5` : ""].filter(Boolean).join(" · ")};
    case "trade_closed": if (e.partial) return {what: `${c}${esc(who)} took profit on part of ${esc(nice(e.symbol))} <span class="${(e.pnl || 0) >= 0 ? "up" : "down"}">${signed(e.pnl || 0)}</span>`,
      why: `Exit: ${e.why_exited || "–"}`, sub: "The rest of the position stays open"};
      return {what: `${c}${esc(who)} closed ${esc(nice(e.symbol))} <span class="${(e.pnl || 0) >= 0 ? "up" : "down"}">${signed(e.pnl || 0)}</span>`,
      why: `Exit: ${e.why_exited || "–"}`, sub: `Why it was bought: ${e.why_entered || "–"}${e.sector ? ` · ${e.sector}` : ""}`};
    case "plan": return {what: `${c}${esc(who)}: ${esc(e.session || "plan")}, ${esc({keep: "kept the plan", revise: "changed the plan", scrap: "scrapped the plan", new: "new plan"}[e.decision] || e.decision)}`,
      why: e.why, sub: (e.summary ? e.summary + " " : "") + ((e.watchlist || []).length ? "Watching " + e.watchlist.map(w => w.symbol).join(", ") + "." : "")};
    case "focus": return {what: `${c}${esc(who)} set its sector focus`, why: e.why,
      sub: [e.lean_in && e.lean_in.length ? "Leaning into " + e.lean_in.join(", ") : "", e.avoid && e.avoid.length ? "avoiding " + e.avoid.join(", ") : "", e.expires ? `until ${e.expires}` : ""].filter(Boolean).join(" · ")};
    case "playbook": return {what: `${c}${esc(who)} set its playbook: ${esc(e.aggression)}`, why: e.why,
      sub: (e.watch || []).length ? "Watching " + e.watch.join(", ") : ""};
    case "topup": return {what: "Every firm's starting balance raised", why: e.note, sub: ""};
    default: return null;
  }
}

function log(){
  const rows = L.filter(e => pick === "all" || e.agent === pick || (e.type === "topup")).map(e => [e, entry(e)]).filter(([, x]) => x);
  $("logcount").textContent = `${rows.length} entries`;
  $("log").innerHTML = rows.length ? rows.slice(0, shown).map(([e, x]) => `<li><time datetime="${esc(e.time)}">${when(e.time)}</time>
    <div><div class="what">${x.what}</div>${x.why ? `<div class="why">${esc(x.why)}</div>` : ""}${x.sub ? `<div class="sub">${esc(x.sub)}</div>` : ""}</div></li>`).join("")
    : `<li class="empty" style="display:block">No decisions recorded yet.</li>`;
  $("more").hidden = rows.length <= shown;
  $("more").onclick = () => { shown += 40; log(); };
}
</script>
</body>
</html>
